server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # API + uploaded media are proxied to the .NET backend.
    # ^~ takes precedence over the static-asset regex below.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # SignalR hub — needs WebSocket upgrade headers and long timeouts.
    location ^~ /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }

    # Hashed build assets can be cached aggressively.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — /alreem, /dashboard/... all resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
